x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://codeevidence:codeevidence@postgres:5432/codeevidence
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
  GITHUB_TOKEN: ${GITHUB_TOKEN}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
  # A model on your Mac (Ollama), seen from inside the containers
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_INPUT_USD_PER_MTOK: ${LLM_INPUT_USD_PER_MTOK:-3.0}
  LLM_OUTPUT_USD_PER_MTOK: ${LLM_OUTPUT_USD_PER_MTOK:-15.0}
  REVIEW_TOKEN_BUDGET: ${REVIEW_TOKEN_BUDGET:-12000}
  REVIEW_BUDGET_USD: ${REVIEW_BUDGET_USD:-0.25}
  REVIEW_ON_SYNC: ${REVIEW_ON_SYNC:-false}
  PUBLISH_REPOSITORIES: ${PUBLISH_REPOSITORIES:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  CHAT_BUDGET_USD: ${CHAT_BUDGET_USD:-0.10}
  CHAT_TOKEN_BUDGET: ${CHAT_TOKEN_BUDGET:-8000}
  TOOLS_ENABLED: ${TOOLS_ENABLED:-true}
  # Links in GitHub comments and commit statuses point here
  DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:5173}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codeevidence-postgres
    environment:
      POSTGRES_DB: codeevidence
      POSTGRES_USER: codeevidence
      POSTGRES_PASSWORD: codeevidence
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeevidence -d codeevidence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codeevidence-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: codeevidence-app
    environment:
      <<: *app-env
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-60}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache/huggingface  # learnings and chat questions are embedded here too
    # --no-access-log: the app writes its own JSON access line per request, with the request id
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"

  worker:
    build: .
    container_name: codeevidence-worker
    environment: *app-env
    volumes:
      - model_cache:/root/.cache/huggingface  # the embedding model, downloaded once
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # On `docker compose stop`, Celery gets SIGTERM: it takes no new jobs and finishes the
    # running ones (warm shutdown). Docker sends SIGKILL after stop_grace_period.
    stop_grace_period: 60s
    command: celery -A app.worker worker --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}

volumes:
  postgres_data:
  model_cache:
