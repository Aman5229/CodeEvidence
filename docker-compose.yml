services:
  postgres:
    image: postgres:16
    container_name: codeevidence-postgres
    environment:
      POSTGRES_DB: codeevidence
      POSTGRES_USER: codeevidence
      POSTGRES_PASSWORD: codeevidence
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeevidence -d codeevidence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codeevidence-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: codeevidence-app
    environment:
      DATABASE_URL: postgresql+psycopg://codeevidence:codeevidence@postgres:5432/codeevidence
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
