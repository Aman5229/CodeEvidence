[project]
name = "codeevidence"
version = "0.1.0"
description = "Repository-aware AI code intelligence and review platform"
requires-python = ">=3.10,<3.13"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.0,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.0,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

analysis = [
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
indent-width = 2

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"