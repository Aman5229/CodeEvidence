[project]
name = "codeevidence"
version = "0.1.0"
description = "Repository-aware AI code intelligence and review platform"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.0,<4",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.0,<3",
    "httpx>=0.27,<1",
    "redis>=6.0,<6.5",
    "celery[redis]>=5.6,<6",
    "prometheus-client>=0.20,<1",
    "scikit-learn>=1.6,<2",
    "pgvector>=0.3,<1",
    "tree-sitter>=0.23,<1",
    "tree-sitter-python>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "anthropic>=0.40,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

loadtest = [
    "locust>=2.40,<3",
]

# The real embedding model (M10). Large (PyTorch), so tests and CI use the fake embedder.
embeddings = [
    "sentence-transformers>=3,<6",
]

analysis = [
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"