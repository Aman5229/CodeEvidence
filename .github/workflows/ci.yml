name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codeevidence
          POSTGRES_PASSWORD: codeevidence
          POSTGRES_DB: codeevidence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codeevidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://codeevidence:codeevidence@localhost:5432/codeevidence_test
      TEST_DATABASE_URL: postgresql+psycopg://codeevidence:codeevidence@localhost:5432/codeevidence_test
      GITHUB_WEBHOOK_SECRET: ci-secret
      GITHUB_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - run: pytest -q
